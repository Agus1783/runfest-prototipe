<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Masuk — Run Festival 2026</title>
        <link rel="stylesheet" href="styles/style.css" />
        <link rel="stylesheet" href="styles/auth.css" />
    </head>
    <body>
        <header class="topbar">
            <div class="container topbar-inner">
                <a class="logo" href="index.html"
                    >🏃 RUN<span>FEST</span> 2026</a
                >
                <input type="checkbox" id="navToggle" class="nav-toggle">
                <label for="navToggle" class="hamburger" aria-label="Buka menu">☰</label>
                <nav class="nav">
                    <a href="index.html">Beranda</a
                    ><a href="pages/podium.html">Podium</a>
                </nav>
            </div>
        </header>
        <main class="container">
            <div class="auth-wrap">
                <div class="auth-card">
                    <span class="kicker">Run Festival 2026</span>
                    <h1>Masuk</h1>
                    <p class="muted small">
                        Akun statis untuk prototipe — belum terhubung ke backend
                        / database.
                    </p>
                    <div id="msg"></div>
                    <form id="formLogin">
                        <label>Email</label
                        ><input
                            type="email"
                            id="email"
                            required
                            placeholder="panitia@runfest.id"
                        />
                        <label>Password</label
                        ><input
                            type="password"
                            id="pass"
                            required
                            placeholder="••••••••"
                        />
                        <button
                            class="btn"
                            style="
                                width: 100%;
                                justify-content: center;
                                margin-top: 18px;
                            "
                            type="submit"
                        >
                            Masuk →
                        </button>
                    </form>
                    <p
                        class="small"
                        style="text-align: center; margin-top: 14px"
                    >
                        Belum punya akun?
                        <a href="register.html">Daftar sebagai peserta</a>
                    </p>
                    <div class="demo">
                        <b>Akun demo</b><br />
                        Panitia: <code>panitia@runfest.id</code> /
                        <code>panitia123</code><br />
                        Peserta: <code>budi@runfest.id</code> /
                        <code>peserta123</code> (BIB RF-101)
                    </div>
                </div>
            </div>
        </main>
        <script src="scripts/data.js"></script>
        <script src="scripts/auth.js"></script>
        <script>
            document
                .getElementById("formLogin")
                .addEventListener("submit", (e) => {
                    e.preventDefault();
                    const u = login(
                        document.getElementById("email").value,
                        document.getElementById("pass").value,
                    );
                    if (!u) {
                        document.getElementById("msg").innerHTML =
                            '<div class="alert err">Email / password salah. Coba akun demo di bawah.</div>';
                        return;
                    }
                    location.href =
                        u.role === "panitia"
                            ? "pages/dashboard.html"
                            : "pages/peserta.html";
                });
        </script>
    </body>
</html>
